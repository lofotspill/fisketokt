<!doctype html>
<html lang="nn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fisketokt – øv på nynorsk</title>
<!-- © Lene Marie Frid 2026 -->
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--gold:#f0b24a;--foam:#eaf3f3;--ok:#8be0b0;--bad:#ff9b85;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100vh;font:17px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--foam);background:#2c7a8a;transition:background 1s}
body[data-l="2"]{background:#1f6378}
body[data-l="3"]{background:#164a63}
body[data-l="4"]{background:#0e3350}
body[data-l="5"]{background:#071f36}
body[data-l="m"]{background:#123a4d}
.lives{display:flex;justify-content:center;gap:8px;margin:14px 0 4px}
.lives svg{display:block;width:58px;height:35px;filter:drop-shadow(0 0 6px rgba(240,178,74,.55))}
.lives .lost svg{opacity:.5;filter:none}
.lives .pop{animation:pop .8s}
@keyframes pop{0%{transform:scale(1)}30%{transform:scale(1.3) rotate(-8deg)}100%{transform:scale(1)}}
.b.mix{border-color:rgba(255,255,255,.35)}
.b.hb{background:#0b2233;border-color:#0b2233;color:var(--foam)}
.b.hb:hover{background:#0e2a40}
main{position:relative;max-width:560px;margin:0 auto;padding:24px 20px 48px}
h1{font:700 clamp(2.4rem,9vw,3.4rem)/1.05 Georgia,serif;margin:.4em 0 .3em}
h2{font:600 1.55rem/1.3 Georgia,serif;margin:.8em 0 1em}
.top{display:flex;justify-content:space-between;gap:8px;font-size:.9rem;opacity:.85}
.b{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;margin:0 0 10px;padding:14px 16px;font:inherit;color:inherit;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.28);border-radius:10px;cursor:pointer;text-align:left}
.b:hover:not(:disabled){background:rgba(255,255,255,.18)}
.b:focus-visible,input:focus-visible,textarea:focus-visible,.lnk:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.go{background:var(--gold);color:#0b2233;border-color:var(--gold);font-weight:600;justify-content:center}
.go:hover:not(:disabled){background:#f5c46c}
.lv{font-size:.85rem;opacity:.85;white-space:nowrap;display:inline-flex;align-items:center;gap:8px}
.dr{display:inline-flex;gap:3px;vertical-align:middle}
.dr i{width:9px;height:9px;border-radius:50%;background:currentColor;opacity:.3;display:inline-block}
.dr i.on{opacity:1}
input,textarea{width:100%;font:inherit;padding:14px;margin-bottom:10px;border-radius:10px;border:1px solid rgba(255,255,255,.4);background:rgba(0,0,0,.25);color:inherit}
.ok{color:var(--ok)}.bad{color:var(--bad)}
.b.right{border-color:var(--ok);background:rgba(139,224,176,.22)}
.b.wrong{border-color:var(--bad);background:rgba(255,155,133,.22)}
.b:disabled{cursor:default;color:inherit}
.fb{margin-top:16px;padding:14px 16px;border-radius:10px;background:rgba(0,0,0,.28)}
.fb p{margin:.2em 0 .8em}
.lnk{background:none;border:0;color:inherit;opacity:.75;text-decoration:underline;font:inherit;cursor:pointer;padding:8px 0;margin-top:12px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:2px}
.bar .lnk{margin:0;padding:6px 0}
.kg{color:var(--gold);font-weight:600;white-space:nowrap}
table{width:100%;border-collapse:collapse;margin:0 0 16px}th,td{padding:8px 10px;border:1px solid rgba(255,255,255,.28);text-align:center}th{font-weight:600;background:rgba(0,0,0,.2);font-size:.9rem}td.tg{border:2px dashed var(--gold);color:var(--gold);font-weight:700}
.unl{font:inherit;font-size:.85rem;color:inherit;background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.35);border-radius:8px;padding:4px 8px;cursor:pointer}.unl:disabled{opacity:.45;cursor:default}
.lvc{display:flex;align-items:center;gap:12px;margin:8px 0}.v{font-size:1.4rem;font-weight:700}
details{margin:0 0 12px;padding:8px 12px;border-radius:10px;background:rgba(0,0,0,.2)}summary{cursor:pointer;font-weight:600}
table{font-size:.95rem}th,td{overflow-wrap:anywhere}
@media (max-width:480px){th,td{padding:6px 4px;font-size:.8rem}}
.id{opacity:.65;font-size:.85rem;white-space:nowrap}
.lk{position:absolute;top:18px;right:18px;width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.35);display:grid;place-items:center;cursor:pointer;padding:0}
.lk:hover{background:rgba(255,255,255,.22)}.lk svg{width:28px;height:28px;fill:#fff}
.lk:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.fb h3{font:600 1.1rem Georgia,serif;margin:1.1em 0 .4em}textarea{resize:vertical}
.b.done{background:rgba(8,40,68,.42)}
.mix{background:rgba(4,22,40,.6)}
.big{font:700 3.5rem/1 Georgia,serif;color:var(--gold);margin:.2em 0 .4em}
@media (prefers-reduced-motion:reduce){body{transition:none}}
</style>
</head>
<body data-l="1">
<main id="app"></main>
<script>
const A={v:'Verb',s:'Substantiv',m:'Småord',o:'Ordforråd',r:'Rett feilen'},K=Object.keys(A),D=[10,30,60,100,200];
// [område, nivå 1-5, spørsmål, rette svar, alternativ (null = skriv sjølv), forklaring]
const Q=[
['v',1,'Eg ___ ballen kvar dag.',['kastar'],['kastar','kaster','kasta','kastet'],'A-verb: kaste – kastar – kasta – kasta.',['å kaste','kastar','kasta','kasta'],1],
['v',1,'Dei ___ brev kvar veke.',['skriv'],['skriv','skriver','skrive','skreiv'],'Sterke verb får ingen ending i presens: skriv.',['å skrive','skriv','skreiv','skrive'],1],
['v',2,'Guten ___ over gjerdet kvar dag.',['hoppar'],['hoppar','hopper','hoppa','hoppet'],'A-verb: hoppe – hoppar – hoppa – hoppa.',['å hoppe','hoppar','hoppa','hoppa'],1],
['v',3,'I går ___ vi ein film.',['såg'],['såg','så','sett','ser'],'Sjå – ser – såg – sett.',['å sjå','ser','såg','sett'],2],
['v',3,'I går ___ ho eit langt brev.',['skreiv'],null,'Skrive – skriv – skreiv – skrive. «Skrev» er bokmål.',['å skrive','skriv','skreiv','skrive'],2],
['v',4,'Dei har ___ mykje vatn.',['drukke'],null,'Drikke – drikk – drakk – drukke.',['å drikke','drikk','drakk','drukke'],3],
['v',5,'I går ___ ho glad.',['vart','blei'],null,'Nynorsk har både vart og blei: bli – blir – vart/blei – blitt.',['å bli','blir','vart / blei','blitt'],2],
['s',1,null,['jenta'],['jenta','jenten','jentene','jenter'],'Hokjønn får -a: jenta.',['ei jente','jenta','jenter','jentene'],1],
['s',1,null,['hestar'],['hestar','hester','hestane','hesten'],'Hankjønn: ein hest – hesten – hestar – hestane.',['ein hest','hesten','hestar','hestane'],2],
['s',2,null,['gutane'],['gutane','gutene','gutar','guten'],'Hankjønn: gutar – gutane.',['ein gut','guten','gutar','gutane'],3],
['s',3,null,['bøker'],['bøker','bøkene','bøkar','boka'],'Ei bok – boka – bøker – bøkene.',['ei bok','boka','bøker','bøkene'],2],
['s',3,null,['fiskane'],null,'Hankjønn: fiskar – fiskane.',['ein fisk','fisken','fiskar','fiskane'],3],
['s',4,null,['øya'],null,'Hokjønn får -a: øya.',['ei øy','øya','øyar','øyane'],1],
['s',5,null,['born'],null,'Eit barn – barnet – born – borna.',['eit barn','barnet','born','borna'],2],
['m',1,'Kva er nynorsk for «hva»?',['kva'],['hva','kva','kvar','kvifor'],'Hv- blir kv- i nynorsk.'],
['m',1,'Kva er nynorsk for «jeg»?',['eg'],['jeg','eg','ei','ho'],'Jeg blir eg.'],
['m',2,'Kva er nynorsk for «bare»?',['berre'],['bare','berre','barre','bere'],'Bare blir berre.'],
['m',2,'Kva er nynorsk for «mye»?',['mykje'],['mye','mykje','myke','mykkje'],'Mye blir mykje.'],
['m',3,'Kva er nynorsk for «hvordan»?',['korleis'],['hvordan','korleis','kvordan','korles'],'Hvordan blir korleis.'],
['m',3,'Skriv nynorsk for «noen» (eintal):',['nokon'],null,'Noen blir nokon.'],
['m',4,'Skriv nynorsk for «hvem»:',['kven'],null,'Hvem blir kven.'],
['m',5,'Skriv nynorsk for «fortsatt»:',['framleis','enno'],null,'Fortsatt kan bli framleis eller enno.'],
['o',1,'Kva er nynorsk for «hjem» (i «gå hjem»)?',['heim'],['hjem','heim','heime','hjeim'],'Hjem blir heim.'],
['o',1,'Kva er nynorsk for «gutt»?',['gut'],['gutt','gut','gute','guten'],'Gutt blir gut.'],
['o',2,'Kva er nynorsk for «fortelle»?',['fortelje'],['fortelle','fortelje','fortella','forteljer'],'Fortelle blir fortelje.'],
['o',3,'Kva er nynorsk for «tirsdag»?',['tysdag'],['tirsdag','tysdag','tiisdag','tysdagen'],'Tirsdag blir tysdag.'],
['o',3,'Skriv nynorsk for «uke»:',['veke'],null,'Uke blir veke.'],
['o',4,'Skriv nynorsk for «hvorfor»:',['kvifor'],null,'Hvorfor blir kvifor.'],
['o',5,'Skriv nynorsk for «mens» (som i «mens vi venter»):',['medan'],null,'Mens blir medan.'],
['r',1,'Kva ord er ikkje nynorsk? «Eg likar ikke fisk.»',['ikke'],['Eg','likar','ikke','fisk'],'Ikke blir ikkje.'],
['r',1,'Kva ord er ikkje nynorsk? «Vi går hjem etter skulen.»',['hjem'],['går','hjem','etter','skulen'],'Hjem blir heim.'],
['r',2,'Kva ord er bokmål? «Jenta kastet ballen langt.»',['kastet'],['Jenta','kastet','ballen','langt'],'Kastet blir kasta.'],
['r',3,'Rett opp ordet «mye»: «Dei har mye fisk.»',['mykje'],null,'Mye blir mykje.'],
['r',3,'Rett opp verbet «spiser»: «Eg spiser fisk kvar dag.»',['et'],null,'Presens av ete: eg et.'],
['r',4,'Rett opp verbet «ligger»: «Boka ligger på bordet.»',['ligg'],null,'Liggje – ligg.'],
['r',5,'Skriv heile setninga på nynorsk: «Jeg vet ikke hva de gjør.»',['eg veit ikkje kva dei gjer'],null,'Eg veit ikkje kva dei gjer.']
];
const norm=s=>s.toLowerCase().replace(/[.,!?«»"]/g,'').replace(/\s+/g,' ').trim();
const dots=n=>`<span class="dr">${[1,2,3,4,5].map(i=>`<i class="${i<=n?'on':''}"></i>`).join('')}</span>`;
const fish=h=>{const c=h?'#f0b24a':'#8fa3b3';return `<svg viewBox="0 0 80 48" width="80" height="48" role="img" aria-label="${h?'Glad fisk':'Trist fisk'}"><path d="M60 24 L78 8 L78 40 Z" fill="${c}"/><ellipse cx="34" cy="24" rx="30" ry="18" fill="${c}"/><circle cx="20" cy="19" r="3.5" fill="#0b2233"/><path d="${h?'M10 28 Q17 35 24 28':'M10 33 Q17 26 24 33'}" stroke="#0b2233" stroke-width="2.5" fill="none" stroke-linecap="round"/>${h?'':'<path d="M27 22 Q25 27 27 28 Q29 27 27 22Z" fill="#9fd4f5"/>'}</svg>`};
const LB=['ubunden eintal','bunden eintal','ubunden fleirtal','bunden fleirtal'],VL=['Grunnform (infinitiv)','Presens (notid)','Preteritum (fortid)','Perfektum partisipp'],COST=100;
const app=document.getElementById('app');
let st=null;try{st=JSON.parse(localStorage.getItem('fisketokt1'))}catch(e){}
st=st&&typeof st==='object'?st:{};st.l=st.l||{};st.s=st.s||{};st.w=st.w||{};st.kg=st.kg||0;st.n=st.n||{};st.seen=st.seen||{};K.forEach(a=>st.l[a]=st.l[a]||1);
const save=()=>{try{localStorage.setItem('fisketokt1',JSON.stringify(st))}catch(e){}};
if(!st.id){st.id=String(10000+Math.floor(Math.random()*90000));save()}
let R;

function home(){
 document.body.dataset.l=1;
 app.innerHTML=`<button class="lk" id="lk" aria-label="Min fremgang og lærar"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M9.3 9.3a2.7 2.7 0 1 1 4 2.35c-.95.6-1.5 1.05-1.5 2.15v.3" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><circle cx="12" cy="17" r="1.15"/></svg></button><h1>Fisketokt</h1><p>Svar rett og fang fisk. Får du nesten alt rett gjennom ein heil runde, seglar du ut på djupare hav med vanskelegare spørsmål og færre hjelpemiddel. Går det trått, vender du tilbake til grunnare vatn og får meir hjelp. Fisk du har fanga, kan du bruke til å kjøpe hint. Framgangen din blir lagra i nettlesaren.</p><p class="kg">🐟 ${st.kg} kg fisk i alt</p><h2>Kva vil du øve på?</h2><button class="b go" id="nv"><span>⚓ Naustet: Lær og øv før toktet</span></button>`
 +K.map(a=>`<button class="b" data-a="${a}"><span>${A[a]}</span><span class="lv">${dots(st.l[a])} ${D[st.l[a]-1]} m</span></button>`).join('')
 +`<button class="b mix" data-a="x"><span>Blanda tokt</span></button><p style="opacity:.55;font-size:.75rem;text-align:center;margin-top:22px">© Lene Marie Frid 2026</p>`;
 app.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>start(b.dataset.a));
 document.getElementById('nv').onclick=naust;
 document.getElementById('lk').onclick=()=>box();
}
function start(a){if(a==='x')return mixRules();R={a,n:st.l[a]>=4?15:10,f:0,ai:0,used:new Set(),wk:new Set(),retry:[],miss:{},res:{},kg:0,open:new Set()};ask()}
const qk=q=>q[0]+'|'+(q[2]||q[6][0]+q[7])+'|'+q[3][0],wk=q=>q[9]||qk(q);
function pick(area){
 const L=st.l[area],rnd=a=>a[Math.floor(Math.random()*a.length)];
 const base=Q.map((q,i)=>i).filter(i=>Q[i][0]===area&&!R.used.has(i)&&!R.wk.has(wk(Q[i])));
 let pool=base.filter(i=>!st.seen[qk(Q[i])]);
 if(!pool.length&&base.length){Q.forEach(q=>{if(q[0]===area)delete st.seen[qk(q)]});pool=base}
 if(!pool.length)return null;
 if(R.mix){const lo=Math.max(2,L),hi=Math.min(5,Math.max(L+2,3)),c=pool.filter(i=>Q[i][1]>=lo&&Q[i][1]<=hi);if(c.length)return rnd(c)}
 const pg=R.f/R.n,T=R.mix?Math.min(5,Math.max(L+1,3)):Math.max(1,Math.min(5,L+(pg<1/3?-1:pg<2/3?0:1))),d=i=>Math.abs(Q[i][1]-T),m=Math.min(...pool.map(d));
 return rnd(pool.filter(i=>d(i)===m));
}
function ask(){
 let idx,rt=false,k=R.retry.findIndex(r=>r.at<=R.f);
 if(k<0&&R.f>=R.n&&R.retry.length)k=0;
 if(k>=0){idx=R.retry.splice(k,1)[0].id;rt=true}
 else{
  if(R.f>=R.n)return fin();
  const first=R.a==='x'?((R.ai%K.length===0&&(R.cyc=shf(K))),R.cyc[R.ai++%K.length]):R.a;
  idx=pick(first);
  if(idx==null)for(const a of K){idx=pick(a);if(idx!=null)break}
  if(idx==null)return fin();
  R.f++;
 }
 R.used.add(idx);R.wk.add(wk(Q[idx]));st.seen[qk(Q[idx])]=1;save();R.cur=idx;R.rt=rt;R.done=false;R.open=new Set();
 const q=Q[idx],a=q[0],l=st.l[a],pr=q[2]||`Kva er ${LB[q[7]]} av «${q[6][0]}»?`;
 document.body.dataset.l=R.mix?'m':l;
 let h=`<div class="top"><span>${A[a]}</span><span>${rt?'Repetisjon':R.f+' av '+R.n}</span><span>Djupn ${D[l-1]} m</span></div><div class="bar"><button class="lnk" id="hh">← Fisketokt</button><span class="kg" id="kg">🐟 ${st.kg} kg</span></div>${R.mix?`<div class="lives" id="lv">${lv(R.lives)}</div>`:''}<h2>${pr}</h2>`;
 if(q[6])h+='<div id="tb"></div>';
 if(q[4])h+=(q[8]?[...q[4]]:[...q[4]].sort(()=>Math.random()-.5)).map(o=>`<button class="b" data-o="${o}">${o}</button>`).join('');
 else h+=`<div id="f"><input id="in" autocomplete="off" autocapitalize="none" spellcheck="false" enterkeyhint="send" aria-label="Svaret ditt"><button class="b go" id="ok" type="button">Svar</button></div>`;
 app.innerHTML=h+'<div id="fb"></div>';
 document.getElementById('hh').onclick=home;
 if(q[6])tb();
 if(q[4])app.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>answer(b.dataset.o,b));
 else{const i=document.getElementById('in');i.focus();const go=()=>answer(i.value);document.getElementById('ok').onclick=go;i.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();go()}}}
}
function tb(){
 const q=Q[R.cur],f=q[6],t=q[7],c=[1,2,3].filter(i=>i!==t),l=st.l[q[0]],lk=c.slice(c.length-(l<3?0:l===3?1:2));
 const ce=i=>i===t?'<td class="tg">?</td>':lk.includes(i)&&!R.open.has(i)?`<td><button class="unl" data-c="${i}"${st.kg<COST||R.done?' disabled':''}>🔒 ${COST} kg</button></td>`:`<td>${f[i]}</td>`;
 document.getElementById('tb').innerHTML='<table>'+(q[0]==='s'?`<tr><th colspan="2">Eintal</th><th colspan="2">Fleirtal</th></tr><tr><th>Ubunden</th><th>Bunden</th><th>Ubunden</th><th>Bunden</th></tr><tr>${ce(0)}${ce(1)}${ce(2)}${ce(3)}</tr>`:VL.map((h,i)=>`<tr><th>${h}</th>${ce(i)}</tr>`).join(''))+'</table>';
 document.querySelectorAll('.unl').forEach(b=>b.onclick=()=>{if(R.done||st.kg<COST)return;st.kg-=COST;R.open.add(+b.dataset.c);save();document.getElementById('kg').textContent='🐟 '+st.kg+' kg';tb()});
}
function answer(v,btn){
 if(R.done||!v.trim())return;R.done=true;
 const q=Q[R.cur],a=q[0],good=q[3].map(norm).includes(norm(v)),kg=good?(R.mix?10:st.l[a]*2):0;
 if(!R.rt&&!R.mix){const r=R.res[a]=R.res[a]||{n:0,c:0};r.n++;r.c+=good?1:0}
 st.kg+=kg;R.kg+=kg;
 if(R.mix){if(good)R.ok++;else{R.lives--;document.getElementById('lv').innerHTML=lv(R.lives,1)}}
 if(!good){R.miss[a]=1}
 save();
 app.querySelectorAll('.b[data-o]').forEach(b=>{b.disabled=true;if(q[3].includes(b.dataset.o))b.classList.add('right');else if(b===btn)b.classList.add('wrong')});
 const f=document.getElementById('f');if(f)f.hidden=true;
 if(q[6])tb();
 document.getElementById('kg').textContent='🐟 '+st.kg+' kg';
 const fb=document.getElementById('fb');fb.className='fb';
 fb.innerHTML=`<p class="${good?'ok':'bad'} v">${good?'✓ Rett!':'✗ Ikkje heilt'}</p>`
  +(q[4]?'':`<p>Du skreiv: <b>${v.trim().replace(/</g,'&lt;')}</b></p>`)
  +(good?'':`<p>Rett svar: <b>${q[3].join(' / ')}</b></p>`)
  +`<p>${q[5]} <span class="id">(F${q[10]})</span></p><p class="kg">+${kg} kg fisk</p><button class="b go" id="nx">${(R.mix&&R.lives<1)||(R.f>=R.n&&!R.retry.length)?'Sjå resultatet':'Neste'}</button>`;
 const n=document.getElementById('nx');n.onclick=R.mix&&R.lives<1?endMix:ask;n.focus({preventScroll:true});
 setTimeout(()=>fb.scrollIntoView({block:'center',behavior:'smooth'}),50);
}
function finish(){
 const ch=[];
 K.forEach(a=>{const r=R.res[a];if(!r||r.n<3)return;
  if(r.n-r.c<=Math.floor(r.n/6)&&st.l[a]<5){st.l[a]++;ch.push({a,up:1})}
  else if(r.c<=r.n/3&&st.l[a]>1){st.l[a]--;ch.push({a,up:0})}});
 save();document.body.dataset.l=1;
 const m=Object.keys(R.miss).map(a=>A[a]);
 app.innerHTML=`<h1>Fangsten er inne</h1><div class="big">${R.kg} kg</div><p class="kg">🐟 ${st.kg} kg fisk i alt</p>`
 +ch.map(c=>`<div class="lvc">${fish(c.up)}<span>${c.up?'Du seglar ut på djupare hav i ':'Vi går litt grunnare i '}${A[c.a]}.</span></div>`).join('')
 +`<p>${m.length?'Øv litt meir på: '+m.join(', ')+'.':'Ingen store feil på denne turen. God tur vidare!'}</p>`
 +K.map(a=>`<div class="b" style="cursor:default"><span>${A[a]}</span><span class="lv">${dots(st.l[a])} ${D[st.l[a]-1]} m</span></div>`).join('')
 +`<button class="b go" id="again">Vidare ut på djupet i ${A[R.a].toLowerCase()}</button><button class="b hb" id="hm"><span>Tilbake til hamna</span></button>`;
 const a=R.a;document.getElementById('again').onclick=()=>start(a);document.getElementById('hm').onclick=home;
}
/* ---------- Naustet: leksjonar ---------- */

{t:'Kva er eit verb?',d:'Ein lesetekst om kva verb er, korleis du finn dei og korleis dei bøyer seg.',i:`<h2>Ord for det som skjer</h2>
<p>Eit <b>verb</b> fortel kva nokon gjer eller kva som skjer: <i>hoppe, fiske, skrive, regne</i>. Nokre verb fortel korleis noko er: <i>vere, bli</i>. Verb kallar vi òg <i>handlingsord</i>.</p>
<h2>Slik kjenner du att eit verb</h2>
<p><b>Å-testen:</b> Kan du setje <i>å</i> framfor ordet? <i>å hoppe, å fiske, å skrive</i>. Då er det eit verb i grunnform (infinitiv).</p>
<p><b>Tidstesten:</b> Set <i>i går</i> eller <i>i morgon</i> framfor setninga. Endrar ordet form? <i>Eg hoppar no</i> blir <i>I går hoppa eg</i>. Då er det eit verb.</p>
<h2>Kvifor bøyer vi verb?</h2>
<p>Verb bøyer seg for å fortelje <b>når</b> noko skjer. Dette kallar vi <b>tempus</b> (tid). Vi brukar fire former:</p>
<table><tr><th></th><th>hoppe</th><th>kjøpe</th></tr><tr><th>Grunnform (infinitiv)</th><td>å hoppe</td><td>å kjøpe</td></tr><tr><th>Presens (notid)</th><td>hoppar</td><td>kjøper</td></tr><tr><th>Preteritum (fortid)</th><td>hoppa</td><td>kjøpte</td></tr><tr><th>Perfektum partisipp (førnotid)</th><td>hoppa</td><td>kjøpt</td></tr></table>
<ul>
<li><b>Grunnform (infinitiv):</b> forma med <i>å</i> framfor. Det er den du finn først i ordboka.</li>
<li><b>Presens:</b> det skjer no: <i>Eg hoppar</i>, <i>eg kjøper</i>.</li>
<li><b>Preteritum:</b> det skjedde før: <i>Eg hoppa</i>, <i>eg kjøpte</i>.</li>
<li><b>Perfektum partisipp (førnotid):</b> blir brukt saman med <i>har</i> eller <i>hadde</i>: <i>Eg har hoppa</i>, <i>eg har kjøpt</i>.</li>
</ul>
<h2>Svake og sterke verb</h2>
<p>Verb bøyer seg på to hovudmåtar. <b>Svake verb</b> held vokalen som han er og får ei <b>ending</b> for å vise fortid: <i>hoppe → hoppa</i>, <i>kjøpe → kjøpte</i>. Dei deler vi i <b>a-verb</b> (fortid på -a) og <b>e-verb</b> (fortid på -te eller -de). <b>Sterke verb</b> byter i staden <b>vokalen</b> inne i ordet: <i>skrive → skreiv</i>, <i>drikke → drakk</i>. Dei får ingen fortidsending.</p>
<p><b>Kvifor heiter dei sterke og svake?</b> Eit sterkt verb klarer å vise fortid heilt aleine, ved å byte vokal. Eit svakt verb er ikkje «sterkt nok» til det, så det må ha ei ending til hjelp. Du lærer å kjenne dei att i neste leksjon.</p>`,it:[]},
{t:'Bøyingsdetektiven',d:'Finn ut kva slags verb det er ut frå bøyinga.',i:`<p>Du kan sjå kva slags verb det er på endingane. Les tabellen og bruk han som fasit.</p><table><tr><th></th><th>Grunnform (infinitiv)</th><th>Presens</th><th>Preteritum</th><th>Perfektum</th></tr><tr><th>A-verb (svakt)</th><td>å hoppe</td><td>hoppar</td><td>hoppa</td><td>hoppa</td></tr><tr><th>E-verb (svakt)</th><td>å kjøpe</td><td>kjøper</td><td>kjøpte</td><td>kjøpt</td></tr><tr><th>Sterkt verb</th><td>å skrive</td><td>skriv</td><td>skreiv</td><td>skrive</td></tr></table><p>A-verb og e-verb er <b>svake verb</b>: dei får ei ending i fortid. <b>Sterke verb</b> byter vokal inne i ordet (<i>skriv – skreiv</i>) og får ingen fortidsending.</p>`,

{t:'Kva er eit substantiv?',d:'Ein lesetekst om kva substantiv er, korleis du finn dei og korleis dei bøyer seg.',i:`<h2>Namn på ting, dyr og folk</h2>
<p>Eit <b>substantiv</b> er eit ord som er namn på noko: ein person (<i>gut, lærar</i>), eit dyr (<i>hest, torsk</i>), ein ting (<i>bok, båt</i>), ein stad (<i>øy, fjord</i>) eller noko du ikkje kan ta på (<i>glede, håp, vind</i>). Substantiv kallar vi òg <i>namneord</i>.</p>
<h2>Slik kjenner du att eit substantiv</h2>
<p><b>Ein-ei-eit-testen:</b> Kan du setje <i>ein</i>, <i>ei</i> eller <i>eit</i> framfor ordet? Då er det eit substantiv: <i>ein fisk, ei bok, eit hus</i>. Det fungerer ikkje med andre typar ord: <i>ein springe</i> og <i>eit raud</i> gir ingen meining, så dei orda er ikkje substantiv.</p>
<p><b>Fleirtalstesten:</b> Kan du snakke om fleire av det? <i>fiskar, bøker, hus</i>. Då er det truleg eit substantiv.</p>
<h2>Kvifor bøyer vi substantiv?</h2>
<p>Substantiv <b>bøyer seg</b>, altså endrar form, for å fortelje to ting: kor mange det er (<b>eintal</b> eller <b>fleirtal</b>), og om lesaren allereie veit kva vi snakkar om (<b>bunden</b>) eller ikkje (<b>ubunden</b>). Høyr forskjellen: <i>Eg såg ein hest</i> (ein hest lesaren ikkje kjenner) mot <i>Eg såg hesten</i> (hesten vi allereie snakkar om).</p>
<table><tr><th></th><th>Eintal</th><th>Fleirtal</th></tr><tr><th>Ubunden</th><td>ein hest</td><td>hestar</td></tr><tr><th>Bunden</th><td>hesten</td><td>hestane</td></tr></table>
<ul>
<li><b>Ubunden eintal:</b> éin ting vi ikkje kjenner enno. Ordet står i grunnforma med <i>ein/ei/eit</i> framfor: <i>ein hest</i>.</li>
<li><b>Bunden eintal:</b> éin ting vi veit kva for ein er. Ei ending blir hengd på ordet: <i>hest + en = hesten</i>.</li>
<li><b>Ubunden fleirtal:</b> fleire ting vi ikkje kjenner enno. Fleirtalsendinga kjem på: <i>hest + ar = hestar</i>.</li>
<li><b>Bunden fleirtal:</b> fleire ting vi veit kva for nokre er. Fleirtalsforma får ei bunden ending til: <i>hest + ane = hestane</i>.</li>
</ul>
<p>Endingane er ulike for hankjønn, hokjønn og inkjekjønn. Det ser du i bøyingsdetektiven, og du lærer meir om kjønn seinare i modulen. I ordboka står grunnforma først og så endingane, så du kan sjå korleis eit ord bøyer seg.</p>`,it:[]},
{t:'Bøyingsdetektiven',d:'Finn kjønnet ut frå korleis ordet bøyer seg.',i:`<p>Kvart substantiv har eit <b>kjønn</b>: hankjønn (<i>ein</i>), hokjønn (<i>ei</i>) eller inkjekjønn (<i>eit</i>). Kjønnet kan du sjå på endingane. Les tabellen, og bruk han som fasit.</p><table><tr><th></th><th>Ub. eintal</th><th>Best. eintal</th><th>Ub. fleirtal</th><th>Best. fleirtal</th></tr><tr><th>Hankjønn</th><td>ein hest</td><td>hesten</td><td>hestar</td><td>hestane</td></tr><tr><th>Hokjønn</th><td>ei bok</td><td>boka</td><td>bøker</td><td>bøkene</td></tr><tr><th>Inkjekjønn</th><td>eit hus</td><td>huset</td><td>hus</td><td>husa</td></tr></table>`,
it:[dt('kaka – kaker – kakene',1,'Best. eintal på -a og fleirtal på -er/-ene: hokjønn (ei kake).'),dt('katten – kattar – kattane',0,'Endingane -en, -ar og -ane: hankjønn (ein katt).'),dt('bordet – bord – borda',2,'Endingane -et, ingen ending og -a: inkjekjønn (eit bord).'),dt('sola – soler – solene',1,'Best. eintal på -a: hokjønn (ei sol).'),dt('skipet – skip – skipa',2,'Endingane -et, ingen ending og -a: inkjekjønn (eit skip).'),dt('bilen – bilar – bilane',0,'Endingane -en, -ar og -ane: hankjønn (ein bil).')]},
{t:'Substantiv har kjønn',d:'Korleis finn du ut om ordet er hankjønn, hokjønn eller inkjekjønn?',i:`<p>Kvart substantiv i nynorsk har eit <b>kjønn</b>: <b>hankjønn</b> (<i>ein</i>), <b>hokjønn</b> (<i>ei</i>) eller <b>inkjekjønn</b> (<i>eit</i>). Kjønnet avgjer korleis ordet blir bøygd, så det er lurt å kunne finne det.</p>
<h2>Slik finn du kjønnet</h2>
<p><b>1. Sei ordet med ein, ei eller eit.</b> Kva høyrest rett ut på dialekten din? <i>ein hest, ei bok, eit hus</i>.</p>
<p><b>2. Sei bunden form.</b> Kva endar ordet på? <b>-en</b> er hankjønn (<i>hesten</i>), <b>-a</b> er hokjønn (<i>boka</i>) og <b>-et</b> er inkjekjønn (<i>huset</i>).</p>
<p><b>3. Sjekk ordboka.</b> Ho oppgir kjønnet, ofte forkorta til <b>m</b> (hankjønn), <b>f</b> (hokjønn) og <b>n</b> (inkjekjønn).</p>
<p><b>Pass på:</b> Kjønnet har ikkje alltid med om noko er hann eller ho. <i>Ei sol</i> og <i>ei øy</i> er hokjønn, og <i>eit barn</i> er inkjekjønn, sjølv om barnet kan vere både gut og jente.</p>
<table><tr><th>Kjønn</th><th>Ord</th><th>Bunden form</th></tr><tr><th>Hankjønn</th><td>ein hest</td><td>hesten (-en)</td></tr><tr><th>Hokjønn</th><td>ei bok</td><td>boka (-a)</td></tr><tr><th>Inkjekjønn</th><td>eit hus</td><td>huset (-et)</td></tr></table>`,

// Eigedomsord: min/mi/mitt/mine må passe med substantivet
const PF={min:['min','mi','mitt','mine'],din:['din','di','ditt','dine'],vår:['vår','vår','vårt','våre'],sin:['sin','si','sitt','sine']},PN=[['hesten',0],['boka',1],['huset',2],['bøkene',3],['guten',0],['jenta',1],['barnet',2],['hestane',3],['bilen',0],['øya',1],['skipet',2],['kattane',3]];
PN.forEach(([n,g],i)=>{const f=i%2?'din':'min',ans=PF[f][g];Q.push(['o',g<2?2:3,`Kva passar? «${n} ___» (${f==='min'?'eg':'du'})`,[ans],PF[f],`${n} ${ans}: ${['hankjønn','hokjønn','inkjekjønn','fleirtal'][g]} får «${ans}».`,null,null,1,'eig:'+n+f]);
 if(i<8)Q.push(['o',4,`Skriv rett form av «vår» for «vi»: «${n} ___»`,[PF.vår[g]],null,`${n} ${PF.vår[g]}: vår – vår – vårt – våre.`,null,null,0,'eig:'+n+'v'])});
[['Han tok boka ___ med seg.','si'],['Ho tok bilen ___ til jobben.','sin'],['Dei vaska huset ___.','sitt'],['Han vaska hestane ___ kvar dag.','sine'],['Ho las bøkene ___.','sine']].forEach(([q,a])=>Q.push(['o',5,`Skriv rett form: «${q}» (sin/si/sitt/sine)`,[a],null,'Når eigaren er den same som subjektet, brukar vi sin/si/sitt/sine.',null,null,0,'eig:'+q]));
lex('o',[['hennes','hennar','q',3],['deres, om noko høyrer til «dei»','deira','q',4],['deres, om noko høyrer til «dere»','dykkar','q',5],['dere, som i «Kjem dere?»','de','q',5],['de, som i «De kjem i dag»','dei','q',1],['meg selv','meg sjølv','q',2],['deg selv','deg sjølv','q',3],['seg selv','seg sjølv','q',3]]);
const hs=t=>{let x=2166136261;for(const c of t){x^=c.charCodeAt(0);x=Math.imul(x,16777619)}return (x>>>0)%90000+10000};
{const u=new Set();Q.forEach(q=>{let n=hs(qk(q));while(u.has(n))n++;u.add(n);q[10]=n})}
const dk=(k,j)=>k+'-'+M[k].ls[j].t;
let N;
function naust(){
 document.body.dataset.l=1;
 app.innerHTML=`<button class="lnk" id="bk">← Fisketokt</button><h1>Naustet</h1><p>Her gjer du deg klar før toktet: les regelen, prøv deg fram og sjå korleis orda bøyer seg. I Naustet fangar du ingen fisk, men du lærer det du treng for å fange meir på toktet.</p>`
 +Object.keys(M).map((k,n)=>{const t=M[k].ls.length,d=M[k].ls.filter((_,j)=>st.n[dk(k,j)]).length;return `<button class="b${d===t?' done':''}" data-k="${k}"><span>Modul ${n+1} · ${M[k].t}</span><span class="lv">${dots(Math.round(d/t*5))} ${d} av ${t}</span></button>`}).join('');
 document.getElementById('bk').onclick=home;
 app.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>mod(b.dataset.k));
}
function mod(k){
 app.innerHTML=`<button class="lnk" id="bk">← Naustet</button><h1>${M[k].t}</h1>`+M[k].ls.map((l,j)=>`<button class="b${st.n[dk(k,j)]?' done':''}" data-j="${j}"><span><b>${st.n[dk(k,j)]?'✓ ':''}${l.t}</b><br><small>${l.d}</small></span></button>`).join('');
 document.getElementById('bk').onclick=naust;
 app.querySelectorAll('[data-j]').forEach(b=>b.onclick=()=>lesson(k,+b.dataset.j));
}
function lesson(k,j){
 N={k,j,i:0,c:0,d:0};const l=M[k].ls[j];
 if(!l.it.length){st.n[dk(k,j)]=1;save()}
 app.innerHTML=`<button class="lnk" id="bk">← ${M[k].t}</button><h1>${l.t}</h1>${l.i}${l.it.length?'<button class="b go" id="sb">Start</button>':''}`;
 document.getElementById('bk').onclick=()=>mod(k);const sb=document.getElementById('sb');if(sb)sb.onclick=nq;
}
function nq(){
 const l=M[N.k].ls[N.j];if(N.i>=l.it.length)return nend();
 const it=l.it[N.i];N.d=0;
 app.innerHTML=`<div class="top"><span>${l.t}</span><span>${N.i+1} av ${l.it.length}</span></div><div class="bar"><button class="lnk" id="bk">← ${M[N.k].t}</button></div><details><summary>Vis regelen</summary>${l.i}</details><h2>${it[0]}</h2>`+it[1].map((o,n)=>`<button class="b" data-n="${n}">${o}</button>`).join('')+'<div id="fb"></div>';
 document.getElementById('bk').onclick=()=>mod(N.k);
 app.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{
  if(N.d)return;N.d=1;const n=+b.dataset.n,good=n===it[2];N.c+=good?1:0;
  app.querySelectorAll('[data-n]').forEach(x=>{x.disabled=true;if(+x.dataset.n===it[2])x.classList.add('right');else if(x===b)x.classList.add('wrong')});
  const fb=document.getElementById('fb');fb.className='fb';
  fb.innerHTML=`<p class="${good?'ok':'bad'} v">${good?'✓ Rett!':'✗ Ikkje heilt'}</p>${good?'':`<p>Rett svar: <b>${it[1][it[2]]}</b></p>`}<p>${it[3]} <span class="id">(N${hs(N.k+'|'+l.t+'|'+it[0])})</span></p><button class="b go" id="nx">${N.i+1>=l.it.length?'Sjå resultatet':'Neste'}</button>`;
  const nx=document.getElementById('nx');nx.onclick=()=>{N.i++;nq()};nx.focus({preventScroll:true});
  setTimeout(()=>fb.scrollIntoView({block:'center',behavior:'smooth'}),50);
 });
}
function nend(){
 const n=M[N.k].ls[N.j].it.length;
 if(N.c>=n-1){st.n[dk(N.k,N.j)]=1;save()}
 app.innerHTML=`<h1>Ferdig!</h1><div class="big">${N.c} av ${n}</div><p>${N.c>=n-1?'Flott! Du er klar for toktet. Leksjonen er merkt som ferdig ✓':'Prøv ein gong til, så sit det snart.'}</p><button class="b go" id="ag">Prøv att</button><button class="lnk" id="bm">Tilbake til modulen</button>`;
 document.getElementById('ag').onclick=()=>lesson(N.k,N.j);document.getElementById('bm').onclick=()=>mod(N.k);
}
/* ---------- Blanda tokt: eiga runde med fem sjansar ---------- */
const fin=()=>R.mix?endMix():finish();
const lv=(n,pop)=>[0,1,2,3,4].map(i=>`<span class="${i<n?'':'lost'}${pop&&i===n?' pop':''}">${fish(i<n)}</span>`).join('');
function mixRules(){
 document.body.dataset.l='m';
 app.innerHTML=`<button class="lnk" id="bk">← Fisketokt</button><h1>Blanda tokt</h1><p><b>Dette er ein vanskelegare modus, fordi alt er blanda.</b> Difor får du meir fisk: <b>10 kg for kvart rette svar</b>, like mykje som på det djupaste havet. Slik fungerer det:</p>
<ul><li><b>20 spørsmål:</b> fire frå kvart område (verb, substantiv, småord, ordforråd og rett feilen), i tilfeldig rekkjefølgje.</li>
<li><b>Litt vanskelegare spørsmål:</b> du får sjeldan dei aller enklaste, og spørsmål kjem ikkje att.</li>
<li><b>Fem liv:</b> dei er viste som fem gule fiskar. Svarar du feil, <b>mistar du eitt liv</b>, og den høgre gule fisken blir grå. Då har du eitt liv mindre igjen.</li>
<li>Har du mist alle liva, er runden slutt. Då kan du prøve på nytt eller gå tilbake til hamna.</li>
<li>Blanda tokt endrar ikkje nivåa dine i dei andre områda.</li></ul>
<div class="lives">${lv(5)}</div><button class="b go" id="sm">Start toktet</button>`;
 document.getElementById('bk').onclick=home;document.getElementById('sm').onclick=startMix;
}
function startMix(){R={a:'x',mix:1,n:20,f:0,ai:0,ok:0,lives:5,used:new Set(),wk:new Set(),retry:[],miss:{},res:{},kg:0,open:new Set()};ask()}
function endMix(){
 document.body.dataset.l='m';const dead=R.lives<1;
 app.innerHTML=`<h1>${dead?'Du har mist alle liva':'Fangsten er inne'}</h1><div class="lives">${lv(R.lives)}</div><div class="big" style="text-align:center">${R.kg} kg</div><p style="text-align:center">${R.ok} rette av ${R.f} spørsmål. <span class="kg">🐟 ${st.kg} kg fisk i alt</span></p><button class="b mix" id="ag"><span>${dead?'Prøv på nytt':'Ny runde'}</span></button><button class="b mix" id="hm"><span>Tilbake til hamna</span></button>`;
 document.getElementById('ag').onclick=mixRules;document.getElementById('hm').onclick=home;
}
/* ---------- Fremgangskode og lærarfelt ---------- */
const hx=t=>{let a=2166136261,b=5381;for(const c of t){a^=c.charCodeAt(0);a=Math.imul(a,16777619);b=Math.imul(b,33)^c.charCodeAt(0)}return (a>>>0).toString(36)+(b>>>0).toString(36)};
const CH='ut4gneglmahm',B36=n=>Math.max(0,Math.floor(n)).toString(36).toUpperCase(),ck=t=>(hs(t+'fisketokt')%1296).toString(36).toUpperCase().padStart(2,'0'),lh=t=>(hs(t)%1296).toString(36).toUpperCase().padStart(2,'0');
const lessonList=()=>{const r=[];for(const k in M)M[k].ls.forEach((l,j)=>r.push(dk(k,j)));return r};
function mkCode(){const p=['FK1',st.id,K.map(a=>st.l[a]).join(''),B36(st.kg),lessonList().filter(x=>st.n[x]).map(lh).join('')].join('-');return p+'-'+ck(p)}
function rdCode(c){const p=String(c).trim().toUpperCase().split('-');if(p.length!==6||p[0]!=='FK1'||!/^\d{5}$/.test(p[1])||ck(p.slice(0,5).join('-'))!==p[5])return null;
 const lv=p[2].split('').map(Number);if(lv.length!==K.length||lv.some(x=>!(x>=1&&x<=5)))return null;const kg=parseInt(p[3],36);if(!(kg>=0))return null;
 const hh=new Set(p[4].match(/.{2}/g)||[]),n={};lessonList().forEach(x=>{if(hh.has(lh(x)))n[x]=1});return {id:p[1],l:Object.fromEntries(K.map((a,i)=>[a,lv[i]])),kg,n}}
/* ---------- Send framgang direkte til Google Forms (i staden for kopier/lim inn) ----------
   Slik set du dette opp:
   1) Lag eit Google-skjema med tre spørsmål av typen «Kort svar»: Elev-ID, Namn og Framgangskode.
   2) Trykk dei tre prikkane øvst i skjemaet → «Hent førehandsutfylt lenke» → skriv t.d. TEST i alle felt → «Hent lenke».
   3) Den lenka inneheld noko slikt som ...viewform?entry.111111=TEST&entry.222222=TEST&entry.333333=TEST
      Talla etter «entry.» er det du limer inn i ENTRY_ID, ENTRY_NAME og ENTRY_CODE under (i same rekkjefølgje som spørsmåla dine).
   4) Lim inn den vanlege delelenka til skjemaet (den som endar på /viewform) i FORM_URL.
*/
const FORM_URL='https://docs.google.com/forms/d/e/1FAIpQLSfI4ZIfsoSsedTEe1w3tWZ_GJ6adbBV1FGO78Z7YCkIkQVJsg/viewform';
const ENTRY_ID='253107520',ENTRY_CODE='1379514168',ENTRY_NAME='323060750',COOLDOWN_MS=30*60*1000;
const cdLeft=()=>Math.max(0,COOLDOWN_MS-(Date.now()-(+(localStorage.getItem('ftSent')||0))));
function sendToTeacher(cd){
 const btn=document.getElementById('cp'),msg=document.getElementById('sndmsg'),left=cdLeft(),nmEl=document.getElementById('nm'),nm=(nmEl.value||'').trim();
 if(!nm){msg.textContent='Skriv inn namnet ditt før du sender.';nmEl.focus();return}
 if(left>0){msg.textContent=`Du har alt sendt. Du kan sende på nytt om ${Math.ceil(left/60000)} min.`;return}
 if(!/^https?:\/\//.test(FORM_URL)){msg.textContent='Skjemaet er ikkje sett opp enno – spør læraren.';return}
 try{
  const action=FORM_URL.replace(/\/viewform.*$/,'/formResponse'),ifr=document.createElement('iframe');
  ifr.name='ftFrame'+Date.now();ifr.style.display='none';document.body.appendChild(ifr);
  const f=document.createElement('form');f.action=action;f.method='POST';f.target=ifr.name;f.style.display='none';
  const add=(n,v)=>{const i=document.createElement('input');i.name=n;i.value=v;f.appendChild(i)};
  add('entry.'+ENTRY_ID,st.id);add('entry.'+ENTRY_NAME,nm);add('entry.'+ENTRY_CODE,cd);
  document.body.appendChild(f);f.submit();
  setTimeout(()=>{f.remove();ifr.remove()},4000);
  st.name=nm;save();
  localStorage.setItem('ftSent',String(Date.now()));
  btn.disabled=true;btn.firstChild.textContent='Sendt ✓';
  msg.textContent='Sendt til læraren! Du kan sende på nytt om 30 min.';
 }catch(e){msg.textContent='Klarte ikkje å sende. Prøv igjen, eller sjekk nettforbindelsen.'}
}
function box(msg){
 document.body.dataset.l=1;const cd=mkCode(),ls=lessonList(),dn=ls.filter(x=>st.n[x]).length;
 app.innerHTML=`<div class="fb" style="margin-top:6px"><h3 style="margin-top:.2em">Fremgangen din</h3>
<table><tr><th>Område</th><th>Nivå</th></tr>${K.map(a=>`<tr><td>${A[a]}</td><td>${dots(st.l[a])} ${D[st.l[a]-1]} m</td></tr>`).join('')}</table>
<p><span class="kg">🐟 ${st.kg} kg fisk</span><br>Naustet: ${dn} av ${ls.length} leksjonar ferdige.</p>
<h3>Fremgangskoden din</h3><p>Skriv namnet ditt og trykk «Send til lærar», så får læraren framgangen din automatisk. Du kan sende på nytt kvart 30. minutt.</p>
<input id="nm" autocomplete="name" placeholder="Fornamnet ditt" aria-label="Namnet ditt" required value="${(st.name||'').replace(/"/g,'&quot;')}">
<button class="b go" id="cp"${cdLeft()>0?' disabled':''}><span>${cdLeft()>0?'Sendt ✓':'Send til lærar'}</span></button>
<p id="sndmsg" style="font-size:.85rem;opacity:.85;margin:6px 0 0">${cdLeft()>0?`Du kan sende på nytt om ${Math.ceil(cdLeft()/60000)} min.`:''}</p>
<details style="margin-top:10px"><summary>Fungerte ikkje sendinga? Vis koden</summary><textarea id="cd" rows="2" readonly>E-${st.id} ${cd}</textarea></details>
<h3>Lærarfelt</h3><input id="cm" autocomplete="off" autocapitalize="none" spellcheck="false" aria-label="Lærarfelt"><button class="b" id="ut"><span>Utfør</span></button><div id="msg">${msg||''}</div></div>
<button class="b mix" id="bk"><span>Tilbake til hamna</span></button>`;
 document.getElementById('bk').onclick=home;
 document.getElementById('cp').onclick=()=>sendToTeacher(cd);
 const go=()=>lf(document.getElementById('cm').value);document.getElementById('ut').onclick=go;document.getElementById('cm').onkeydown=e=>{if(e.key==='Enter')go()};
}
function lf(v){
 const t=v.trim().split(/\s+/),m=document.getElementById('msg');
 if(!t[0]||hx(t[0].toLowerCase())!==CH){m.textContent='Ukjend kommando.';return}
 if((t[1]||'').toLowerCase()==='oversikt')return ovw();
 if(t.length<3){m.textContent='Manglar kode.';return}
 const id=(t[1]||'').toUpperCase().replace(/^E-?/,''),c=rdCode(t.slice(2).join(''));
 if(!c){m.textContent='Ukjend kode.';return}
 if(c.id!==id){m.textContent='Koden høyrer ikkje til denne IDen.';return}
 st.id=c.id;st.l=c.l;st.kg=c.kg;st.n=c.n;st.s={};st.w={};st.seen={};save();box('Fremgangen er henta tilbake ✓');
}
function ovw(){
 const m=document.getElementById('msg');m.innerHTML='<h3>Klasseoversikt</h3><textarea id="pl" rows="6" placeholder="Lim inn kodane, ein per linje"></textarea><button class="b go" id="sv"><span>Vis oversikt</span></button><div id="tv" style="overflow-x:auto"></div>';
 document.getElementById('sv').onclick=()=>{const cs=document.getElementById('pl').value.match(/FK1(?:-[0-9A-Za-z]*){5}/gi)||[],tot=lessonList().length;
  document.getElementById('tv').innerHTML=cs.length?'<table><tr><th>ID</th>'+K.map(a=>`<th>${A[a]}</th>`).join('')+'<th>Fisk</th><th>Naustet</th></tr>'+cs.map(x=>{const c=rdCode(x);return c?`<tr><td>E-${c.id}</td>${K.map(a=>`<td>${c.l[a]}</td>`).join('')}<td>${c.kg}</td><td>${Object.keys(c.n).length}/${tot}</td></tr>`:`<tr><td colspan="8">Ugyldig kode</td></tr>`}).join('')+'</table>':'<p>Fann ingen koder.</p>'}
}
home();
